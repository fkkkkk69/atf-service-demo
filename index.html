<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atf Service 11 — автосервис в Балашихе | Ремонт АКПП, двигателя, диагностика</title>
<meta name="description" content="Автосервис Atf Service 11 в Балашихе. Диагностика от 900₽, замена масла от 1200₽, ремонт АКПП от 7000₽. Рейтинг 5.0, 51 отзыв на Яндекс.Картах. Проспект Ленина, вл70.">
<meta property="og:title" content="Atf Service 11 — автосервис в Балашихе">
<meta property="og:description" content="Ремонт АКПП, двигателя, диагностика. Рейтинг 5.0 · 51 отзыв. Проспект Ленина, вл70, Балашиха.">
<meta property="og:type" content="business.business">
<meta name="theme-color" content="#0a0a0a">
<style>
  @import url('https://googleapis.com');

  :root{
    --bg: #0a0a0a;
    --bg-panel: #131313;
    --steel: #3a3a3a;
    --red: #e8261a;
    --red-dim: #7a1712;
    --white: #f3f1ec;
    --grey: #8a8a86;
    --line: #232323;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Manrope',sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3,.eyebrow,.nav-logo,.btn{font-family:'Oswald',sans-serif;text-transform:uppercase;}

  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}

  /* honeycomb ambient background */
  .hex-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(135deg, transparent 48%, rgba(232,38,26,0.05) 49%, rgba(232,38,26,0.05) 51%, transparent 52%);
    background-size: 140px 140px;
    opacity:0.5;
    animation:drift 30s linear infinite;
  }

  .wrap{max-width:1180px; margin:0 auto; padding:0 28px; position:relative; z-index:1;}

  /* NAV */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(10,10,10,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav{
    max-width:1180px; margin:0 auto; padding:16px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-logo{display:flex; align-items:center; gap:10px; font-size:20px; font-weight:700; letter-spacing:1px;}
  .nav-logo img{height:38px; width:38px;}
  .nav-links{display:flex; gap:34px; font-size:14px; letter-spacing:1.5px; font-weight:500;}
  .nav-links a{color:var(--grey); transition:color .2s;}
  .nav-links a:hover{color:var(--red);}
  .nav-cta{
    background:var(--red); color:#fff; padding:10px 22px;
    font-size:13px; font-weight:600; letter-spacing:1.5px;
    border-radius:2px; transition:background .2s;
  }
  .nav-cta:hover{background:#c91f14;}
  .nav-call:hover{border-color:var(--red) !important; color:var(--red);}
  .nav-mobile{display:none;}

  /* HERO */
  .hero{
    position:relative; min-height:100vh; display:flex; align-items:center;
    padding-top:90px;
    background:
      linear-gradient(180deg, rgba(10,10,10,0.4) 0%, rgba(10,10,10,0.75) 55%, var(--bg) 100%),
      url('img/work7-placeholder.jpg') center/cover;
  }
  .hero-bg{
    position:absolute; inset:0; z-index:-1;
    background-image:url('img/work_hero.jpg');
    background-size:cover; background-position:center 30%;
    filter:brightness(0.55) saturate(1.05);
  }
  .hero-grid{display:grid; grid-template-columns:1.15fr 0.85fr; gap:60px; align-items:center; width:100%;}
  .eyebrow{
    color:var(--red); font-size:13px; letter-spacing:4px; font-weight:600;
    display:flex; align-items:center; gap:12px; margin-bottom:22px;
  }
  .eyebrow::before{content:''; width:36px; height:2px; background:var(--red);}
  .hero h1{
    font-size:clamp(42px,6vw,74px); line-height:0.98; font-weight:700;
    letter-spacing:-1px; margin-bottom:24px;
  }
  .hero h1 span{color:var(--red);}
  .hero p{
    font-family:'Manrope'; font-size:17px; color:var(--grey); max-width:480px;
    line-height:1.6; margin-bottom:34px;
  }
  .hero-actions{display:flex; gap:16px; flex-wrap:wrap;}
  .btn{
    padding:16px 32px; font-size:14px; font-weight:600; letter-spacing:2px;
    border-radius:2px; display:inline-flex; align-items:center; gap:10px;
    transition:all .25s;
  }
  .btn-primary{background:var(--red); color:#fff;}
  .btn-primary:hover{background:#c91f14; transform:translateY(-2px);}
  .btn-ghost{border:1px solid #3a3a3a; color:var(--white);}
  .btn-ghost:hover{border-color:var(--red); color:var(--red);}

  .hero-stats{
    display:flex; flex-direction:column; gap:0;
    border-left:1px solid var(--line); padding-left:40px;
  }
  .stat{padding:22px 0; border-bottom:1px solid var(--line);}
  .stat:last-child{border-bottom:none;}
  .stat-num{font-family:'Oswald'; font-size:44px; font-weight:700; color:var(--red); line-height:1;}
  .stat-label{color:var(--grey); font-size:13px; letter-spacing:1px; margin-top:6px; text-transform:uppercase;}

  /* MARQUEE */
  .marquee{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:18px 0; overflow:hidden; white-space:nowrap; background:var(--bg-panel);
  }
  .marquee-track{display:inline-block; animation:scroll 28s linear infinite;}
  .marquee-track span{
    font-family:'Oswald'; font-size:15px; letter-spacing:3px; color:var(--grey);
    margin:0 30px; text-transform:uppercase;
  }
  .marquee-track span.accent{color:var(--red);}
  @keyframes scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  /* SECTION generic */
  section{padding:120px 0; position:relative; z-index:1;}
  .section-head{margin-bottom:60px; max-width:640px;}
  .section-head h2{font-size:clamp(32px,4vw,48px); font-weight:700; line-height:1.05; letter-spacing:-0.5px;}
  .section-head h2 span{color:var(--red);}
  .section-head p{color:var(--grey); margin-top:16px; font-size:16px; line-height:1.6;}

  /* SERVICES */
  .services{background:var(--bg-panel); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .svc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
  .svc-card{
    background:var(--bg-panel); padding:38px 32px; transition:background .25s, transform .25s;
    position:relative;
  }
  .svc-card:hover{background:#191919; transform:translateY(-4px);}
  .svc-num{font-family:'Oswald'; color:var(--red-dim); font-size:13px; letter-spacing:2px; margin-bottom:20px;}
  .svc-card h3{font-size:20px; font-weight:600; margin-bottom:10px; letter-spacing:0.3px;}
  .svc-card .price{color:var(--red); font-family:'Oswald'; font-size:15px; letter-spacing:1px; margin-top:16px; font-weight:500;}
  .svc-card p.desc{color:var(--grey); font-size:14.5px; line-height:1.6;}
  .svc-note{
    text-align:center; padding:26px; color:var(--grey); font-size:14px;
    border-top:1px solid var(--line); letter-spacing:0.3px;
  }
  .svc-note b{color:var(--white);}

  /* GALLERY */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(2,220px); gap:12px;
  }
  .g-item{position:relative; overflow:hidden; border-radius:3px; cursor:pointer;}
  .g-item img{width:100%; height:100%; object-fit:cover; transition:transform .5s;}
  .g-item:hover img{transform:scale(1.08);}
  .g-item::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.75) 100%);
  }
  .g-item.tall{grid-row:span 2;}
  .g-item.wide{grid-column:span 2;}
  .g-caption{
    position:absolute; bottom:16px; left:18px; z-index:2;
    font-family:'Oswald'; font-size:13px; letter-spacing:1.5px; color:var(--white);
    text-transform:uppercase;
  }

  /* REVIEWS — ОБНОВЛЕННАЯ СЕКЦИЯ ОТЗЫВОВ С ПРОЗРАЧНОЙ АВАТАРКОЙ */
  .reviews{
    background:var(--bg-panel); 
    border-top:1px solid var(--line); 
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden; /* Чтобы большая аватарка не вылезала за края секции */
  }

  /* Создаем невидимый фоновый слой для картинки */
  .reviews::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* Убедитесь, что файл лежит в той же папке или укажите правильный путь */
    background-image: url('image_QlcAKC.png'); 
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    width: 60%;
    height: 85%;
    /* Очень легкая прозрачность (0.03), чтобы текст хорошо читался */
    opacity: 0.03; 
    z-index: 0;
    pointer-events: none;
  }

  /* Выталкиваем реальный текст отзывов поверх фоновой картинки */
  .reviews .wrap {
    position: relative;
    z-index: 1;
  }

  .rev-top{display:flex; align-items:baseline; gap:24px; margin-bottom:50px; flex-wrap:wrap;}
  .rev-score{font-family:'Oswald'; font-size:64px; font-weight:700; color:var(--red); line-height:1;}
  .rev-meta{color:var(--grey); font-size:14px; letter-spacing:0.5px;}
  .rev-stars{color:var(--red); font-size:18px; letter-spacing:2px;}
  .rev-grid{display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;}
</style>
</head>
<body>

  <!-- Пример разметки для проверки -->
  <div class="hex-glow"></div>

  <section class="reviews">
    <div class="wrap">
      <div class="rev-top">
        <div class="rev-score">5.0</div>
        <div class="rev-meta">
          <div class="rev-stars">★★★★★</div>
          <div>51 отзыв на Яндекс.Картах</div>
        </div>
      </div>
      <div class="rev-grid">
        <!-- Сюда будут вставляться карточки отзывов -->
      </div>
    </div>
  </section>

</body>
</html>
